<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      font-family: 'Trebuchet MS', 'lucida sans unicode', 'lucida grande', 'lucida sans', Arial, sans-serif;
      background-color: lightblue;
    }
  </style>
</head>

<body>
  <h2>MY contact</h2>
  <main class="contact-card">
    <header>
      <h2>Get in Touch 📩</h2>
      <p class="subtitle">Feel free to reach out to me for collaborations, inquiries, or just to say hi!</p>
    </header>

    <section class="info-group">
      <h3>Contact Information</h3>
      <p><strong>Email:</strong> redzstanleybenedicto@gmail.com</p>
      <p><strong>Phone:</strong> Secret 🤫</p>
      <p><strong>Location:</strong> Philippines 🇵🇭</p>
    </section>

    <section class="info-group">
      <h3>Send Me a Message</h3>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Your Name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Your Email" required>

        <label for="message">Message:</label>
        <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>

        <button type="button">Send Message</button>
</body>

</html>
